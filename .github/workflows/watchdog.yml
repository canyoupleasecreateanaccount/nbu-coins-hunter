name: Watchdog for coin news checker

# Runs independently of "Check NBU coin news" and reports when that workflow
# has stopped actually running - either because a run failed silently before
# reaching its own failure-notification step, or because GitHub disabled the
# schedule (e.g. after 60 days without repository activity, or a manual
# disable). A plain "if: failure()" step inside the monitored workflow can't
# catch that second case, since a disabled workflow never runs at all.

on:
  schedule:
    # Offset off :00 for the same reason as check-coin-news.yml's schedule:
    # round minutes are GitHub's busiest scheduling slots.
    - cron: '11 */3 * * *'
  workflow_dispatch: {}

permissions:
  actions: read

env:
  MONITORED_WORKFLOW: check-coin-news.yml
  # 3x the monitored workflow's 2-hour interval, to absorb the occasional
  # scheduling delay GitHub documents for cron-triggered runs while still
  # catching a genuinely dead schedule well before a full day goes by.
  STALE_THRESHOLD_MINUTES: 360
  # How many scheduled (not manual) runs to expect in a 24h window at the
  # monitored workflow's 2-hour cadence - shown in the alert message for
  # context. The alert itself only fires on zero: GitHub's scheduler can
  # legitimately skip individual slots under load, and a single stale run
  # is already caught by STALE_THRESHOLD_MINUTES above, so this check
  # exists purely to catch "the schedule did not fire even once all day".
  EXPECTED_SCHEDULED_RUNS_PER_DAY: 12
  # Alert when this many most-recent completed runs failed back to back.
  # A single failure is often a transient network blip that the next run
  # recovers from on its own, so alerting on one would just be noise.
  CONSECUTIVE_FAILURES_TO_ALERT: 3

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Check monitored workflow health
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="${{ github.repository }}"
          workflow_info=$(gh api "repos/${repo}/actions/workflows/${MONITORED_WORKFLOW}")
          state=$(echo "$workflow_info" | jq -r '.state')

          # Scheduled-only runs, counted two ways: how many landed in the
          # last 24h (catches chronic under-firing - e.g. GitHub silently
          # skipping most slots - that a single fresh run would hide), and
          # how long it has been since the last one (catches a schedule
          # that has stopped dead, faster than waiting for the daily count
          # to drop). A burst of manual workflow_dispatch runs (e.g. while
          # debugging) must not be able to mask either - hence event=schedule.
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          scheduled_24h=$(gh api "repos/${repo}/actions/workflows/${MONITORED_WORKFLOW}/runs" -f event=schedule -f "created=>${since}" -f per_page=1)
          scheduled_count_24h=$(echo "$scheduled_24h" | jq -r '.total_count')

          last_scheduled=$(gh api "repos/${repo}/actions/workflows/${MONITORED_WORKFLOW}/runs" -f event=schedule -f per_page=1)
          last_scheduled_at=$(echo "$last_scheduled" | jq -r '.workflow_runs[0].created_at // empty')

          # Any-trigger runs, for the failure-streak check below - a broken
          # script is broken regardless of what triggered it, and this also
          # covers "has it ever run at all" for a brand new workflow.
          runs=$(gh api "repos/${repo}/actions/workflows/${MONITORED_WORKFLOW}/runs?per_page=${CONSECUTIVE_FAILURES_TO_ALERT}")
          run_count=$(echo "$runs" | jq -r '.total_count')

          if [ "$run_count" -eq 0 ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "message=⚠️ Workflow '${MONITORED_WORKFLOW}' has never run yet." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_conclusion=$(echo "$runs" | jq -r '.workflow_runs[0].conclusion // "in_progress"')

          # Count how many of the most recent *completed* runs failed in a row.
          failed_streak=$(echo "$runs" | jq -r '
            [.workflow_runs[] | select(.conclusion != null)]
            | map(.conclusion)
            | (index("success") // length)
          ')
          completed_count=$(echo "$runs" | jq -r '[.workflow_runs[] | select(.conclusion != null)] | length')

          minutes_since_scheduled="n/a"
          if [ -n "$last_scheduled_at" ]; then
            last_epoch=$(date -d "$last_scheduled_at" +%s)
            now_epoch=$(date -u +%s)
            minutes_since_scheduled=$(( (now_epoch - last_epoch) / 60 ))
          fi

          echo "State: $state. Scheduled runs in last 24h: ${scheduled_count_24h} (expected ~${EXPECTED_SCHEDULED_RUNS_PER_DAY})."
          echo "Last scheduled run: ${last_scheduled_at:-never} (${minutes_since_scheduled} min ago)."
          echo "Consecutive failures among ${completed_count} recent completed runs (any trigger): ${failed_streak}"

          if [ "$state" != "active" ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "message=⚠️ Workflow '${MONITORED_WORKFLOW}' is not active (state: ${state}). GitHub may have auto-disabled it after 60 days without repository activity - re-enable it from the Actions tab." >> "$GITHUB_OUTPUT"
          elif [ "$minutes_since_scheduled" != "n/a" ] && [ "$minutes_since_scheduled" -gt "$STALE_THRESHOLD_MINUTES" ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "message=⚠️ Workflow '${MONITORED_WORKFLOW}' hasn't had a *scheduled* run in ${minutes_since_scheduled} minutes (expected every 2h). Last conclusion: ${last_conclusion}. If this persists, try disabling and re-enabling the workflow from the Actions tab - GitHub's scheduler can get stuck." >> "$GITHUB_OUTPUT"
          elif [ "$scheduled_count_24h" -eq 0 ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "message=⚠️ Workflow '${MONITORED_WORKFLOW}' had zero scheduled runs in the last 24h (expected ~${EXPECTED_SCHEDULED_RUNS_PER_DAY}, every 2h). GitHub's scheduler appears to have stopped firing it entirely." >> "$GITHUB_OUTPUT"
          elif [ "$completed_count" -ge "$CONSECUTIVE_FAILURES_TO_ALERT" ] && [ "$failed_streak" -ge "$CONSECUTIVE_FAILURES_TO_ALERT" ]; then
            # The workflow is running but every recent run failed. Its own
            # failure notification may be exactly what is broken (bad bot
            # token, revoked chat), so this alert is the only safety net.
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "message=⚠️ Workflow '${MONITORED_WORKFLOW}' is running but its last ${failed_streak} runs all failed. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/${MONITORED_WORKFLOW}" >> "$GITHUB_OUTPUT"
          else
            echo "alert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram alert
        if: steps.health.outputs.alert == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_RECIPIENTS: ${{ secrets.TELEGRAM_RECIPIENTS }}
          ALERT_MESSAGE: ${{ steps.health.outputs.message }}
        run: |
          recipients="${TELEGRAM_RECIPIENTS:-${TELEGRAM_BOT_TOKEN}:${TELEGRAM_CHAT_ID}}"
          echo "$recipients" | tr ',' '\n' | while IFS= read -r entry; do
            entry="$(echo "$entry" | tr -d '[:space:]')"
            [ -z "$entry" ] && continue
            token="${entry%:*}"
            chat_id="${entry##*:}"
            curl -sS -X POST "https://api.telegram.org/bot${token}/sendMessage" \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "text=${ALERT_MESSAGE}"
          done
