name: Check NBU coin news

on:
  schedule:
    # Offset from round minutes (:00/:05/:15/:30/...) on purpose: those are
    # the most congested times for scheduled GitHub Actions runs worldwide
    # (GitHub's own docs call out "the start of every hour" specifically),
    # so a plain "*/15" is more likely to be delayed than an odd offset
    # like this one. Same ~15-minute cadence either way.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with heartbeat.yml - both push commits to the same branch, so they
# must never run at the same time (see the note in heartbeat.yml).
concurrency:
  group: repo-state-commit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # coins.bank.gov.ua's bot shield answers cloud/datacenter IPs (which
      # is exactly what this runner has) with a JavaScript challenge that
      # plain HTTP requests can never solve - http_client.SiteClient falls
      # back to a real headless browser for that one case. The browser
      # binary itself is cached (~/.cache/ms-playwright) so a routine run
      # does not re-download it; only the OS dependencies get reinstalled
      # every time, since this VM is thrown away after each run.
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Check for new coin news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_RECIPIENTS: ${{ secrets.TELEGRAM_RECIPIENTS }}
        run: python scripts/check_news.py

      # Checks https://coins.bank.gov.ua/sitemap.xml, which can list an
      # article before it shows up on the news listing above. Runs every
      # cycle alongside the check above (not as a separate parallel job)
      # so both state files can be committed together in one step below,
      # with no risk of two jobs racing to push at the same time.
      # Runs even if the news check above failed: the two checks are
      # independent, and a failure there (say, a Telegram hiccup) should not
      # cost us the sitemap's early warning as well.
      - name: Check sitemap for early coin articles
        if: '!cancelled()'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_RECIPIENTS: ${{ secrets.TELEGRAM_RECIPIENTS }}
        run: python scripts/check_sitemap.py

      # Checks https://coins.bank.gov.ua/catalog.html - the shop itself,
      # not a news feed. A coin can be announced days before it is
      # actually purchasable, and popular releases sell out within
      # minutes, so this is the check that catches the moment there is
      # something to actually buy. Independent of the two checks above:
      # runs even if either of them failed.
      - name: Check catalog for new lots for sale
        if: '!cancelled()'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_RECIPIENTS: ${{ secrets.TELEGRAM_RECIPIENTS }}
        run: python scripts/check_lots.py

      # Also runs after a failed check, so whatever progress was made (e.g.
      # articles already notified before an error) is persisted and not
      # announced a second time on the next run.
      - name: Commit updated state
        if: '!cancelled()'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen_news.json state/seen_sitemap.json state/seen_lots.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen news state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No state changes to commit."
          fi

      # Runs only if any earlier step in this job failed, so a broken run
      # (site layout changed, network error, bad secret, ...) shows up in
      # Telegram immediately instead of silently going red on the Actions tab.
      # Written in plain bash/curl rather than calling into scripts/ - if the
      # "Install dependencies" step itself failed, the Python requests
      # library might not even be installed at this point.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_RECIPIENTS: ${{ secrets.TELEGRAM_RECIPIENTS }}
        run: |
          message="⚠️ Workflow 'Check NBU coin news' failed (run #${{ github.run_number }}). Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          recipients="${TELEGRAM_RECIPIENTS:-${TELEGRAM_BOT_TOKEN}:${TELEGRAM_CHAT_ID}}"
          echo "$recipients" | tr ',' '\n' | while IFS= read -r entry; do
            entry="$(echo "$entry" | tr -d '[:space:]')"
            [ -z "$entry" ] && continue
            token="${entry%:*}"
            chat_id="${entry##*:}"
            curl -sS -X POST "https://api.telegram.org/bot${token}/sendMessage" \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "text=${message}"
          done
